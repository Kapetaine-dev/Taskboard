<!-- src/app/header/header.html -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-mark">TB</span>
      <span class="logo-text">TaskBoard</span>
    </div>

    <nav class="nav">
      <a
        routerLink="/"
        routerLinkActive="nav-link-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        Accueil
      </a>

      <a
        routerLink="/tasks"
        routerLinkActive="nav-link-active"
        class="nav-link"
      >
        Tâches
      </a>

      <a
        routerLink="/about"
        routerLinkActive="nav-link-active"
        class="nav-link"
      >
        À propos
      </a>
    </nav>
  </div>
</header>
