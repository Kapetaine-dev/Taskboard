<h2>Liste des tâches</h2>

<button (click)="addTask('Tâche ajoutée', 'Description de test')">
  Ajouter une tâche de test
</button>

@if (tasks$ | async; as tasks) {
  <ul>
    @for (t of tasks; track t.id) {
      <li>
        <h3>{{ t.title }}</h3>
        <p>{{ t.description }}</p>
      </li>
    }
  </ul>
} @else {
  <p>Chargement des tâches...</p>
}
